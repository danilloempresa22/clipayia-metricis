name: build
# Gera o Clipay.exe. Para publicar uma versao: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: dependencias
        run: pip install -r requirements.txt -r requirements-janela.txt pyinstaller pytest
      - name: ffmpeg (build LGPL)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin/ffmpeg.exe
      - name: testes
        run: python -m pytest ../tests -q
      - name: empacota
        run: pyinstaller clipay.spec --noconfirm
      - name: autoteste do .exe (tudo veio dentro do arquivo?)
        shell: pwsh
        run: |
          $p = Start-Process dist/Clipay.exe -ArgumentList "--autoteste","$env:RUNNER_TEMP/auto.json" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/auto.json"
          if ($p.ExitCode -ne 0) { throw "autoteste falhou" }
      - uses: actions/upload-artifact@v4
        with: { name: Clipay-windows, path: app/dist/Clipay.exe }
      - name: publica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: app/dist/Clipay.exe }
